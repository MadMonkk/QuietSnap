plugins { id 'com.android.application' }

android {
    namespace 'dk.quietsnap'
    compileSdk 35

    defaultConfig {
        applicationId 'dk.quietsnap'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '1.1-test1'
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions += 'camera'
    productFlavors {
        bagkamera {
            dimension 'camera'
            applicationIdSuffix '.bag'
            versionNameSuffix '-bagkamera'
            buildConfigField 'boolean', 'CAMERA_SELECTABLE', 'false'
            resValue 'string', 'app_name', 'QuietSnap Bagkamera'
        }
        kameravalg {
            dimension 'camera'
            applicationIdSuffix '.valg'
            versionNameSuffix '-kameravalg'
            buildConfigField 'boolean', 'CAMERA_SELECTABLE', 'true'
            resValue 'string', 'app_name', 'QuietSnap Kameravalg'
        }
    }
}
